<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos</h1>

        <section class="galeria">

            <article class="producto">
                <img src="https://loremflickr.com/300/200/headphones" alt="Audifonos inalambricos">
                <div class="producto-info">
                    <h2>Audifonos inalambricos</h2>
                    <p class="precio">Q299.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://loremflickr.com/300/200/sneakers" alt="Zapatillas deportivas">
                <div class="producto-info">
                    <h2>Zapatillas deportivas</h2>
                    <p class="precio">Q399.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://loremflickr.com/300/200/smartwatch" alt="Reloj inteligente">
                <div class="producto-info">
                    <h2>Reloj inteligente</h2>
                    <p class="precio">Q599.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://loremflickr.com/300/200/backpack" alt="Mochila de viaje">
                <div class="producto-info">
                    <h2>Mochila de viaje</h2>
                    <p class="precio">Q249.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://loremflickr.com/300/200/sunglasses" alt="Lentes de sol">
                <div class="producto-info">
                    <h2>Lentes de sol</h2>
                    <p class="precio">Q179.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://loremflickr.com/300/200/camera" alt="Camara instantanea">
                <div class="producto-info">
                    <h2>Camara instantanea</h2>
                    <p class="precio">Q499.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>

        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
