<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="fecha">
      <span class="dia">11</span>
      <span class="mes-anio">Sept<br>2021</span>
    </div>
    <span class="dia-semana">SÁBADO</span>
  </header>

  <div class="acciones">
    <span class="nueva-tarea">Nueva tarea</span>
    <button class="btn-agregar" aria-label="Agregar tarea">+</button>
    <button class="btn-ordenar">Ordenar</button>
  </div>

  <ul class="lista-tareas">
    <li class="tarea completada">
      <span class="texto">Salir a caminar</span>
    </li>
    <li class="tarea completada">
      <span class="texto">Comprar jabón</span>
    </li>
    <li class="tarea">
      <span class="texto">Hacer ejercicio</span>
    </li>
  </ul>

  <footer class="footer-azul">
    <p>Ver Tareas, Calendar, Tasks, et.</p>
    <button class="btn-entendido">Entendido</button>
  </footer>

</body>
</html>
